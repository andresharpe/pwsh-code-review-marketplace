name: Auto version bump

# Bumps the minor version on every push to main, including PR merges.
# Skips its own bump commits via the if-guard so it does not loop.
#
# Bumps:
#   .claude-plugin/marketplace.json   (top-level .version + .plugins[*].version)
#   plugins/pwsh-code-review/.claude-plugin/plugin.json   (.version)
#
# Tags v<new-version> and pushes the tag along with the bump commit.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next minor version
        id: ver
        run: |
          current=$(jq -r .version .claude-plugin/marketplace.json)
          IFS=. read -r maj min pat <<<"$current"
          next="${maj}.$((min + 1)).0"
          # If v${next} already exists as a tag, the JSONs are behind the
          # tag history (e.g. an earlier run committed the JSON bump but
          # failed before tagging, or someone tagged out of band). Skip
          # the bump rather than failing the next N pushes -- a follow-up
          # `chore(release):`-prefixed PR can resync the JSONs.
          if git rev-parse --verify --quiet "refs/tags/v${next}" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag v${next} already exists; skipping bump. Sync .claude-plugin/marketplace.json + plugins/pwsh-code-review/.claude-plugin/plugin.json to v${next} (or higher) in a chore(release):-prefixed PR."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Bumping ${current} -> ${next}"

      - name: Bump versions in JSON files
        if: steps.ver.outputs.skip != 'true'
        run: |
          next="${{ steps.ver.outputs.next }}"

          # marketplace.json: top-level .version, plus the plugin entry's .version
          tmp=$(mktemp)
          jq --arg v "$next" '
            .version = $v
            | .plugins = (
                .plugins | map(
                  if .name == "pwsh-code-review" then .version = $v else . end
                )
              )
          ' .claude-plugin/marketplace.json > "$tmp"
          mv "$tmp" .claude-plugin/marketplace.json

          # plugin.json: .version
          tmp=$(mktemp)
          jq --arg v "$next" '.version = $v' \
            plugins/pwsh-code-review/.claude-plugin/plugin.json > "$tmp"
          mv "$tmp" plugins/pwsh-code-review/.claude-plugin/plugin.json

      - name: Commit, tag, push
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          next="${{ steps.ver.outputs.next }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json \
                  plugins/pwsh-code-review/.claude-plugin/plugin.json
          git commit -m "chore(release): bump to v${next}"
          # Annotated tag (-a). --follow-tags below only pushes annotated
          # tags; a lightweight `git tag "v..."` would be created on the
          # runner and silently discarded.
          git tag -a "v${next}" -m "Release v${next}"
          git push origin main --follow-tags
